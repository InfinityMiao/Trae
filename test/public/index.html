<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的简单网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        
        .info-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .info-box p {
            margin: 10px 0;
            font-size: 1.1em;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        #server-time {
            font-weight: bold;
            color: #ffd700;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        
        .feature {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        
        .feature:hover {
            transform: translateY(-5px);
        }
        
        .feature h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .feature p {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 欢迎来到我的网站</h1>
        <p class="subtitle">这是一个使用 Node.js 和 Express 构建的简单网站</p>
        
        <div class="info-box">
            <p>服务器时间: <span id="server-time">加载中...</span></p>
        </div>
        
        <button class="btn" onclick="getServerInfo()">获取服务器信息</button>
        
        <div class="features">
            <div class="feature">
                <h3>⚡ 快速</h3>
                <p>基于 Express 框架</p>
            </div>
            <div class="feature">
                <h3>🎨 美观</h3>
                <p>现代化设计</p>
            </div>
            <div class="feature">
                <h3>📱 响应式</h3>
                <p>支持各种设备</p>
            </div>
        </div>
    </div>
    
    <script>
        async function getServerInfo() {
            try {
                const response = await fetch('/api/info');
                const data = await response.json();
                document.getElementById('server-time').textContent = data.time;
            } catch (error) {
                console.error('获取服务器信息失败:', error);
            }
        }
        
        getServerInfo();
        setInterval(getServerInfo, 1000);
    </script>
</body>
</html>
